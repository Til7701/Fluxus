name: Maven Verify

permissions: { }

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 27
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 27
          distribution: 'temurin'
          cache: "maven"
      - name: Build and Test
        run: |
          ./mvnw clean verify --batch-mode --update-snapshots
      - name: Test Reproducibility
        run: |
          ./mvnw clean install -DskipTests -DskipITs --batch-mode
          ./mvnw clean verify artifact:compare -DskipTests -DskipITs --batch-mode
